name: llms-full

on:
  push:
    branches: [master]
    paths:
      - website/docs/**
      - website/static/llms.txt
      - scripts/generate-llms-full.js

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate llms-full
        run: node scripts/generate-llms-full.js

      # master is protected (PR-only). Do not push commits directly —
      # open/update a PR with the regenerated file instead.
      - name: Open PR with llms-full update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: website/static/llms-full.txt
          commit-message: "docs: update llms-full"
          title: "docs: update llms-full"
          body: |
            Automated refresh of `website/static/llms-full.txt` after docs changes on `master`.

            Generated by the `llms-full` workflow (replaces the previous direct push to `master`, which failed under branch protection: GH013 — changes must be made through a pull request).
          branch: chore/update-llms-full
          base: master
          delete-branch: true
